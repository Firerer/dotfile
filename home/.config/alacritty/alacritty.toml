
[cursor]
style = "Block"
vi_mode_style = "Block"

[colors]
draw_bold_text_with_bright_colors = true

[env]
TERM = "xterm-256color"

[font]
size = 16

[font.normal]
family = "Hack Nerd Font"

[font.offset]
y = 1

[terminal.shell]
program = "fish"

[[keyboard.bindings]]
action = "ResetFontSize"
key = "Key0"
mods = "Control"

[[keyboard.bindings]]
action = "IncreaseFontSize"
key = "Equals"
mods = "Control"

[[keyboard.bindings]]
action = "DecreaseFontSize"
key = "Minus"
mods = "Control"


[window]
dynamic_padding = true
opacity = 0.85

[window.padding]
x = 0
y = 0

[general]
live_config_reload = true
import = ["./current-theme.toml"]
