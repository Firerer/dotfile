# systemd-tmpfiles --user --create "$HOME/dotfile/dotfiles.conf"

# Register this manifest for future user tmpfiles runs.
d %h/.config 0755 - - - -
d %h/.config/user-tmpfiles.d 0755 - - - -
L %h/.config/user-tmpfiles.d/dotfiles.conf - - - - %h/dotfile/dotfiles.conf

# Top-level configuration fully owned by this repository.
L %h/.agents - - - - %h/dotfile/home/.agents
L %h/.bash_profile - - - - %h/dotfile/home/.bash_profile
L %h/.bashrc - - - - %h/dotfile/home/.bashrc
L %h/.gitconfig - - - - %h/dotfile/home/.gitconfig
L %h/.ideavimrc - - - - %h/dotfile/home/.ideavimrc
L %h/.vimrc - - - - %h/dotfile/home/.vimrc

# Application directories fully owned by this repository.
L %h/.config/alacritty - - - - %h/dotfile/home/.config/alacritty
L %h/.config/btop - - - - %h/dotfile/home/.config/btop
L %h/.config/environment.d - - - - %h/dotfile/home/.config/environment.d
L %h/.config/fastfetch - - - - %h/dotfile/home/.config/fastfetch
L %h/.config/fcitx5 - - - - %h/dotfile/home/.config/fcitx5
L %h/.config/fish/conf.d - - - - %h/dotfile/home/.config/fish/conf.d
L %h/.config/fish/functions - - - - %h/dotfile/home/.config/fish/functions
L %h/.config/fontconfig - - - - %h/dotfile/home/.config/fontconfig
L %h/.config/git - - - - %h/dotfile/home/.config/git
L %h/.config/helix - - - - %h/dotfile/home/.config/helix
L %h/.config/lazygit - - - - %h/dotfile/home/.config/lazygit
L %h/.config/lf - - - - %h/dotfile/home/.config/lf
L %h/.config/nix - - - - %h/dotfile/home/.config/nix
L %h/.config/nvim - - - - %h/dotfile/home/.config/nvim
L %h/.config/paru - - - - %h/dotfile/home/.config/paru
L %h/.config/qt5ct - - - - %h/dotfile/home/.config/qt5ct
L %h/.config/qt6ct - - - - %h/dotfile/home/.config/qt6ct
L %h/.config/starship - - - - %h/dotfile/home/.config/starship
L %h/.config/superfile - - - - %h/dotfile/home/.config/superfile
L %h/.config/zathura - - - - %h/dotfile/home/.config/zathura
L %h/.config/zellij - - - - %h/dotfile/home/.config/zellij

# Mutable application directories retain real parents.
d %h/.config/fish 0755 - - - -
d %h/.config/fish/completions 0755 - - - -
L %h/.config/fish/completions/pnpm.fish - - - - %h/dotfile/home/.config/fish/completions/pnpm.fish
L %h/.config/fish/config.fish - - - - %h/dotfile/home/.config/fish/config.fish
L %h/.config/fish/keybind.fish - - - - %h/dotfile/home/.config/fish/keybind.fish

d %h/.config/htop 0755 - - - -
L %h/.config/htop/htoprc - - - - %h/dotfile/home/.config/htop/htoprc

# Selected portable COSMIC settings; hardware and transient state stay local.
d %h/.config/cosmic 0755 - - - -
L %h/.config/cosmic/com.system76.CosmicBackground - - - - %h/dotfile/home/.config/cosmic/com.system76.CosmicBackground
L %h/.config/cosmic/com.system76.CosmicComp - - - - %h/dotfile/home/.config/cosmic/com.system76.CosmicComp
L %h/.config/cosmic/com.system76.CosmicIdle - - - - %h/dotfile/home/.config/cosmic/com.system76.CosmicIdle
L %h/.config/cosmic/com.system76.CosmicPanel - - - - %h/dotfile/home/.config/cosmic/com.system76.CosmicPanel
L %h/.config/cosmic/com.system76.CosmicPanel.Dock - - - - %h/dotfile/home/.config/cosmic/com.system76.CosmicPanel.Dock
L %h/.config/cosmic/com.system76.CosmicPanel.Panel - - - - %h/dotfile/home/.config/cosmic/com.system76.CosmicPanel.Panel
L %h/.config/cosmic/com.system76.CosmicTheme.Mode - - - - %h/dotfile/home/.config/cosmic/com.system76.CosmicTheme.Mode
d %h/.config/cosmic/com.system76.CosmicSettings.Shortcuts 0755 - - - -
d %h/.config/cosmic/com.system76.CosmicSettings.Shortcuts/v1 0755 - - - -
L %h/.config/cosmic/com.system76.CosmicSettings.Shortcuts/v1/system_actions - - - - %h/dotfile/home/.config/cosmic/com.system76.CosmicSettings.Shortcuts/v1/system_actions

# Per-user files that are portable but live in otherwise mutable directories.
L %h/.config/user-dirs.dirs - - - - %h/dotfile/home/.config/user-dirs.dirs
L %h/.config/vimium-options.json - - - - %h/dotfile/home/.config/vimium-options.json

# User units and declarative enablement links.
d %h/.config/systemd 0755 - - - -
d %h/.config/systemd/user 0755 - - - -
d %h/.config/systemd/user/default.target.wants 0755 - - - -
d %h/.config/systemd/user/timers.target.wants 0755 - - - -
L %h/.config/systemd/user/dotfiles-theme-sync.path - - - - %h/dotfile/home/.config/systemd/user/dotfiles-theme-sync.path
L %h/.config/systemd/user/dotfiles-theme-sync.service - - - - %h/dotfile/home/.config/systemd/user/dotfiles-theme-sync.service
L %h/.config/systemd/user/omni-google-drive-bisync.service - - - - %h/dotfile/home/.config/systemd/user/omni-google-drive-bisync.service
L %h/.config/systemd/user/omni-google-drive-bisync.timer - - - - %h/dotfile/home/.config/systemd/user/omni-google-drive-bisync.timer
L %h/.config/systemd/user/default.target.wants/dotfiles-theme-sync.path - - - - %h/.config/systemd/user/dotfiles-theme-sync.path
L %h/.config/systemd/user/timers.target.wants/omni-google-drive-bisync.timer - - - - %h/dotfile/home/.config/systemd/user/omni-google-drive-bisync.timer

# Personal commands retain a mutable parent for unrelated scripts.
d %h/.local 0755 - - - -
d %h/.local/bin 0755 - - - -
L %h/.local/bin/dotfiles - - - - %h/dotfile/home/.local/bin/dotfiles
L %h/.local/bin/omni-google-drive-bisync - - - - %h/dotfile/home/.local/bin/omni-google-drive-bisync
L %h/.local/bin/qmk-flash - - - - %h/dotfile/home/.local/bin/qmk-flash
L %h/.local/bin/sync-cosmic-theme - - - - %h/dotfile/home/.local/bin/sync-cosmic-theme
L %h/.local/bin/sync-cosmic-wallpaper - - - - %h/dotfile/home/.local/bin/sync-cosmic-wallpaper
