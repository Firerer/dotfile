# Parent directories needed in a fresh home directory.
d %h/.config 0755 - - - -
d %h/.config/fcitx5 0700 - - - -
d %h/.config/fcitx5/conf 0700 - - - -
d %h/.config/fish 0755 - - - -
d %h/.config/fish/completions 0755 - - - -
d %h/.config/helix 0755 - - - -
d %h/.config/htop 0755 - - - -
d %h/.config/paru 0755 - - - -
d %h/.config/fontconfig/conf.d 0755 - - - -

# Top-level configuration.
L %h/.bash_profile - - - - %h/dotfile/home/.bash_profile
L %h/.bashrc - - - - %h/dotfile/home/.bashrc
L %h/.gitconfig - - - - %h/dotfile/home/.gitconfig
L %h/.ideavimrc - - - - %h/dotfile/home/.ideavimrc
L %h/.vimrc - - - - %h/dotfile/home/.vimrc
L %h/.xprofile - - - - %h/dotfile/home/.xprofile
L %h/notes - - - - %h/dotfile/notes

# Application directories fully owned by this repository.
L %h/.config/alacritty - - - - %h/dotfile/home/.config/alacritty
L %h/.config/lf - - - - %h/dotfile/home/.config/lf
L %h/.config/nvim - - - - %h/dotfile/home/.config/nvim
L %h/.config/zathura - - - - %h/dotfile/home/.config/zathura
L %h/.config/zellij - - - - %h/dotfile/home/.config/zellij

# Mutable application directories retain real parents.
L %h/.config/fcitx5/config - - - - %h/dotfile/home/.config/fcitx5/config
L %h/.config/fcitx5/profile - - - - %h/dotfile/home/.config/fcitx5/profile
L %h/.config/fcitx5/conf/cached_layouts - - - - %h/dotfile/home/.config/fcitx5/conf/cached_layouts
L %h/.config/fcitx5/conf/chttrans.conf - - - - %h/dotfile/home/.config/fcitx5/conf/chttrans.conf
L %h/.config/fcitx5/conf/classicui.conf - - - - %h/dotfile/home/.config/fcitx5/conf/classicui.conf
L %h/.config/fcitx5/conf/clipboard.conf - - - - %h/dotfile/home/.config/fcitx5/conf/clipboard.conf
L %h/.config/fcitx5/conf/cloudpinyin.conf - - - - %h/dotfile/home/.config/fcitx5/conf/cloudpinyin.conf
L %h/.config/fcitx5/conf/keyboard.conf - - - - %h/dotfile/home/.config/fcitx5/conf/keyboard.conf
L %h/.config/fcitx5/conf/notifications.conf - - - - %h/dotfile/home/.config/fcitx5/conf/notifications.conf
L %h/.config/fcitx5/conf/pinyin.conf - - - - %h/dotfile/home/.config/fcitx5/conf/pinyin.conf
L %h/.config/fcitx5/conf/punctuation.conf - - - - %h/dotfile/home/.config/fcitx5/conf/punctuation.conf
L %h/.config/fcitx5/conf/spell.conf - - - - %h/dotfile/home/.config/fcitx5/conf/spell.conf
L %h/.config/fcitx5/conf/unicode.conf - - - - %h/dotfile/home/.config/fcitx5/conf/unicode.conf
L %h/.config/fcitx5/conf/xcb.conf - - - - %h/dotfile/home/.config/fcitx5/conf/xcb.conf
L %h/.config/fcitx5/conf/xim.conf - - - - %h/dotfile/home/.config/fcitx5/conf/xim.conf

L %h/.config/fish/completions/atuin.fish - - - - %h/dotfile/home/.config/fish/completions/atuin.fish
L %h/.config/fish/completions/pnpm.fish - - - - %h/dotfile/home/.config/fish/completions/pnpm.fish
L %h/.config/fish/conf.d - - - - %h/dotfile/home/.config/fish/conf.d
L %h/.config/fish/config.fish - - - - %h/dotfile/home/.config/fish/config.fish
L %h/.config/fish/functions - - - - %h/dotfile/home/.config/fish/functions
L %h/.config/fish/keybind.fish - - - - %h/dotfile/home/.config/fish/keybind.fish

L %h/.config/helix/config.toml - - - - %h/dotfile/home/.config/helix/config.toml
L %h/.config/helix/languages.toml - - - - %h/dotfile/home/.config/helix/languages.toml
L %h/.config/htop/htoprc - - - - %h/dotfile/home/.config/htop/htoprc
L %h/.config/paru/paru.conf - - - - %h/dotfile/home/.config/paru/paru.conf
L %h/.config/vimium-options.json - - - - %h/dotfile/home/.config/vimium-options.json
L %h/.config/fontconfig/conf.d/10-dotfiles-profile.conf - - - - %h/dotfile/home/.config/fontconfig/conf.d/10-dotfiles-profile.conf
